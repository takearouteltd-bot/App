# Builds the App Store IPA on GitHub's Mac and, if asked, uploads it to TestFlight.
#
#   gh workflow run build-ipa.yml --ref <branch>                  build only (artifact)
#   gh workflow run build-ipa.yml --ref <branch> -f upload=true   build + upload to TestFlight
#
# Signing is manual: the team has no registered devices, so Xcode's automatic signing (which
# archives with a development profile) can't work. The Apple Distribution certificate and the
# "TakeARoute App Store" profile are made once with scripts/asc-setup.mjs, which also stores
# the secrets below; scripts/ios-signing.mjs points the app target at them after prebuild.
# Uploading needs the TakeARoute app to exist in App Store Connect first.
#
# Repo secrets: ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8 (upload); IOS_DIST_P12_BASE64,
# IOS_DIST_P12_PASSWORD (certificate + key), IOS_PROFILE_BASE64. Repo variable: APPLE_TEAM_ID.
# The build number is app.json's expo.ios.buildNumber (kept equal to android.versionCode);
# raise it for every upload.
name: Build iOS IPA

on:
  workflow_dispatch:
    inputs:
      upload:
        description: Upload to TestFlight
        type: boolean
        default: false

concurrency:
  group: build-ipa
  cancel-in-progress: false

env:
  TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
  PROFILE_NAME: TakeARoute App Store

jobs:
  ipa:
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: App Store Connect key
        env:
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
          KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          # altool looks in ~/private_keys.
          mkdir -p ~/private_keys
          printf '%s\n' "$KEY_P8" > ~/private_keys/AuthKey_$KEY_ID.p8

      - name: Signing certificate and profile
        env:
          P12: ${{ secrets.IOS_DIST_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_DIST_P12_PASSWORD }}
          PROFILE: ${{ secrets.IOS_PROFILE_BASE64 }}
        run: |
          KC=$RUNNER_TEMP/signing.keychain-db
          KC_PW=$(openssl rand -hex 16)
          security create-keychain -p "$KC_PW" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KC_PW" "$KC"
          printf '%s' "$P12" | base64 -d > $RUNNER_TEMP/dist.p12
          security import $RUNNER_TEMP/dist.p12 -k "$KC" -P "$P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -k "$KC_PW" "$KC" > /dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          printf '%s' "$PROFILE" | base64 -d > ~/Library/MobileDevice/Provisioning\ Profiles/takearoute-app-store.mobileprovision
          security find-identity -v -p codesigning "$KC"

      - name: Prebuild
        run: |
          [ -n "$TEAM_ID" ] || { echo "::error::Repo variable APPLE_TEAM_ID is not set (run scripts/asc-setup.mjs)"; exit 1; }
          npx expo prebuild --platform ios --clean --no-install
          node scripts/ios-signing.mjs "$PROFILE_NAME" "$TEAM_ID"
          grep -A3 "aps-environment" ios/takearoute/takearoute.entitlements

      - name: Pods
        # stripe-ios is cloned from GitHub and has timed out before; try three times.
        run: |
          cd ios
          for i in 1 2 3; do pod install && exit 0; echo "pod install failed (try $i)"; sleep 20; done
          exit 1

      - name: Archive and sign
        run: |
          set -o pipefail
          xcodebuild -workspace ios/takearoute.xcworkspace -scheme takearoute -configuration Release \
            -destination generic/platform=iOS -archivePath build/TakeARoute.xcarchive archive | tail -60
          cat > build/ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>provisioningProfiles</key>
            <dict><key>com.takearoute.app</key><string>$PROFILE_NAME</string></dict>
            <key>destination</key><string>export</string>
            <key>uploadSymbols</key><true/>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive -archivePath build/TakeARoute.xcarchive \
            -exportOptionsPlist build/ExportOptions.plist -exportPath build/ipa | tail -30

      - name: Name the IPA
        id: ipa
        run: |
          APP=build/TakeARoute.xcarchive/Products/Applications/takearoute.app
          VERSION=$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' "$APP/Info.plist")
          BUILD=$(/usr/libexec/PlistBuddy -c 'Print CFBundleVersion' "$APP/Info.plist")
          mkdir -p out && cp build/ipa/*.ipa "out/TakeARoute-$VERSION-$BUILD.ipa"
          echo "version=$VERSION-$BUILD" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: TakeARoute-ios-v${{ steps.ipa.outputs.version }}
          path: out/*.ipa
          retention-days: 30

      - name: Upload to TestFlight
        if: ${{ inputs.upload }}
        env:
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: xcrun altool --upload-app --type ios -f out/*.ipa --apiKey "$KEY_ID" --apiIssuer "$ISSUER_ID"
