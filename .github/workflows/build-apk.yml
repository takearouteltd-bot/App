name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Generate Android project
        run: npx expo prebuild --platform android --clean --no-install

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon -Dorg.gradle.jvmargs=-Xmx4g -PreactNativeArchitectures=arm64-v8a,armeabi-v7a

      - name: Name the file by version
        id: ver
        run: |
          V=$(node -p "const a=require('./app.json').expo; a.version+'-'+a.android.versionCode")
          mkdir -p out && cp android/app/build/outputs/apk/release/app-release.apk "out/TakeARoute-$V.apk"
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TakeARoute-v${{ steps.ver.outputs.version }}-apk
          path: out/*.apk
